name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: orchestrai
          POSTGRES_PASSWORD: orchestrai-test-password
          POSTGRES_DB: orchestrai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Setup Checkpointer & Run Migrations
        env:
          DATABASE_URL: postgresql://orchestrai:orchestrai-test-password@localhost:5432/orchestrai_test
          DATABASE_URL_UNPOOLED: postgresql://orchestrai:orchestrai-test-password@localhost:5432/orchestrai_test
          REDIS_URL: redis://localhost:6379
          TOKEN_SECRET: da1259dec9ed79f89de8376c281d4c7dc2ac39f219abd8922fdd55c2ea4fc96d
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock-ci-key' }}
        run: |
          docker exec -i $(docker ps -q --filter ancestor=pgvector/pgvector:pg16) psql -U orchestrai -d orchestrai_test -c "CREATE EXTENSION IF NOT EXISTS vector;" || true
          npm run checkpointer:setup
          npm run db:migrate
          npm run db:seed

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://orchestrai:orchestrai-test-password@localhost:5432/orchestrai_test
          DATABASE_URL_UNPOOLED: postgresql://orchestrai:orchestrai-test-password@localhost:5432/orchestrai_test
          REDIS_URL: redis://localhost:6379
          TOKEN_SECRET: da1259dec9ed79f89de8376c281d4c7dc2ac39f219abd8922fdd55c2ea4fc96d
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock-ci-key' }}
          ENABLE_DEMO_ENDPOINTS: 'true'
        run: npm test

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repo name for docker tag
        id: repo_name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/backend:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.repo_name.outputs.IMAGE_NAME }}

      - name: Validate Railway secret and config
        env:
          _RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          _RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_NAME }}
        run: |
          MISSING=""
          [ -z "$_RAILWAY_TOKEN" ]  && MISSING="$MISSING RAILWAY_TOKEN (secret)"
          [ -z "$_RAILWAY_SERVICE" ] && MISSING="$MISSING RAILWAY_SERVICE_NAME (variable)"
          if [ -n "$MISSING" ]; then
            echo "::error::Required Railway config is not set:$MISSING"
            echo ""
            echo "  RAILWAY_TOKEN      → GitHub Settings → Secrets and variables → Actions → Secrets"
            echo "  RAILWAY_SERVICE_NAME → GitHub Settings → Secrets and variables → Actions → Variables"
            echo "    Set RAILWAY_SERVICE_NAME to the exact service name shown in your Railway dashboard."
            exit 1
          fi
          echo "RAILWAY_TOKEN and RAILWAY_SERVICE_NAME are both present."

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service "${{ vars.RAILWAY_SERVICE_NAME }}" --environment production --ci

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required Vercel secrets
        env:
          _VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          _VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          _VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          MISSING=""
          [ -z "$_VERCEL_TOKEN" ]      && MISSING="$MISSING VERCEL_TOKEN"
          [ -z "$_VERCEL_ORG_ID" ]     && MISSING="$MISSING VERCEL_ORG_ID"
          [ -z "$_VERCEL_PROJECT_ID" ] && MISSING="$MISSING VERCEL_PROJECT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Required GitHub Actions secrets are not set:$MISSING"
            echo ""
            echo "Add them at: GitHub → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "All required Vercel secrets are present."

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel --token "$VERCEL_TOKEN" \
            --yes \
            --prod
