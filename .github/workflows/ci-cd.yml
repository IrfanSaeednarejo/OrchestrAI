name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repo name for docker tag
        id: repo_name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/backend:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.repo_name.outputs.IMAGE_NAME }}

      - name: Validate Railway secret
        env:
          _RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$_RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set."
            echo "Add it at: GitHub → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "RAILWAY_TOKEN is present."

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE_NAME }}
        run: |
          # RAILWAY_SERVICE_NAME is a repository variable (not a secret) set in GitHub →
          # Settings → Secrets and variables → Actions → Variables → RAILWAY_SERVICE_NAME.
          # Set its value to the exact service name shown in your Railway dashboard.
          # If it is unset, omit --service and let Railway infer from project context.
          if [ -n "$RAILWAY_SERVICE" ]; then
            railway up --service "$RAILWAY_SERVICE" --environment production --ci
          else
            echo "::warning::RAILWAY_SERVICE_NAME variable is not set; deploying without --service (uses Railway project context)."
            railway up --environment production --ci
          fi

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required Vercel secrets
        env:
          _VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          _VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          _VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          MISSING=""
          [ -z "$_VERCEL_TOKEN" ]      && MISSING="$MISSING VERCEL_TOKEN"
          [ -z "$_VERCEL_ORG_ID" ]     && MISSING="$MISSING VERCEL_ORG_ID"
          [ -z "$_VERCEL_PROJECT_ID" ] && MISSING="$MISSING VERCEL_PROJECT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Required GitHub Actions secrets are not set:$MISSING"
            echo ""
            echo "Add them at: GitHub → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "All required Vercel secrets are present."

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./client
